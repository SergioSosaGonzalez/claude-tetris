name: OpenCode Issue Solver

on:
  issues:
    types: [opened, labeled]

jobs:
  analyze-issue:
    # Se ejecuta si el Issue recién abierto tiene la etiqueta 'opencode' 
    # o si se le asigna manualmente la etiqueta 'opencode'
    if: contains(github.event.issue.labels.*.name, 'opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Analyze Issue with OpenCode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CI: true
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"

          # Le pedimos a OpenCode que analice el problema sin modificar archivos
          ANALYSIS=$(opencode --model openai/gpt-4o-mini --non-interactive --prompt "Analiza la siguiente solicitud: $ISSUE_TITLE. Detalles: $ISSUE_BODY")

          # Publicar el análisis directamente como un comentario en el Issue
          gh issue comment ${{ github.event.issue.number }} --body "$ANALYSIS"